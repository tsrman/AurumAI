version: 2

# One entry per ecosystem. Minor and patch updates arrive as one grouped pull
# request per ecosystem; major updates stay individual so each can be reviewed
# and tested on its own. The ignore rules below name major versions known to be
# incompatible; remove a rule when its migration is done.
updates:
  # Python services: uv projects (pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directories:
      - "/business-backend"
      - "/conversation-runner"
      - "/tool-worker"
      - "/skill-executor"
      - "/rag-api"
      - "/web-tools"
      - "/hermes-preview"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Upgraded manually across all services together with the lint fixes.
      - dependency-name: "ruff"
      # SDK 3+ targets the Langfuse v3 server; the deployment ships v2.
      - dependency-name: "langfuse"
        versions: [">=3"]

  # rag-worker runs alone: resolving its torch/docling stack can take most of
  # a Dependabot job's time budget, which cancelled the shared Python run.
  # Keep its ignore rules identical to the entry above.
  - package-ecosystem: "uv"
    directories:
      - "/rag-worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      rag-worker-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Upgraded manually across all services together with the lint fixes.
      - dependency-name: "ruff"
      # SDK 3+ targets the Langfuse v3 server; the deployment ships v2.
      - dependency-name: "langfuse"
        versions: [">=3"]

  # Frontends and the scripts/ harness.
  - package-ecosystem: "npm"
    directories:
      - "/business-ui"
      - "/admin-ui"
      - "/scripts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Unsupported by typescript-eslint; the language check needs the JS API.
      - dependency-name: "typescript"
        versions: [">=7"]
      # Changes the hook signatures used by business-ui/src/lib/api.ts.
      - dependency-name: "ky"
        versions: [">=2"]

  # Application, infrastructure and reference-server Dockerfiles.
  - package-ecosystem: "docker"
    directories:
      - "/business-backend"
      - "/conversation-runner"
      - "/tool-worker"
      - "/skill-executor"
      - "/skill-sandbox"
      - "/hermes-sandbox"
      - "/rag-api"
      - "/rag-worker"
      - "/web-tools"
      - "/hermes-preview"
      - "/business-ui"
      - "/admin-ui"
      - "/mcp/everything"
      - "/mcp/fetch"
      - "/infra/postgres"
      - "/infra/web-egress"
      - "/infra/maintenance-egress"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Adopted for all services at once together with CI's setup-python;
      # native dependencies lack 3.14 wheels today.
      - dependency-name: "python"
        versions: [">=3.13"]

  # CI workflow actions.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
