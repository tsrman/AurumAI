name: oss source release

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  source-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install maintenance checks
        run: npm ci --ignore-scripts
        working-directory: scripts
      - name: Export reviewed source and check inventory
        run: |
          python3 scripts/prepare-oss-release.py export --source . --destination "$RUNNER_TEMP/AurumAI" --manifest release/oss-manifest.json --report "$RUNNER_TEMP/inventory.json"
          python3 scripts/prepare-oss-release.py verify --candidate "$RUNNER_TEMP/AurumAI" --manifest release/oss-manifest.json --inventory "$RUNNER_TEMP/inventory.json" --report "$RUNNER_TEMP/source-checks.json"
      - name: Install pinned independent scanner
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan public candidate
        run: '"$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/AurumAI" --config "$RUNNER_TEMP/AurumAI/.gitleaks.toml" --max-archive-depth 2 --max-decode-depth 2 --redact --no-banner --report-format json --report-path "$RUNNER_TEMP/gitleaks-report.json"'
