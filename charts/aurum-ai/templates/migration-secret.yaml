{{- if and .Values.migrations.enabled .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aurum-ai.migrationSecretName" . }}
  labels:
    {{- include "aurum-ai.labels" . | nindent 4 }}
    app.kubernetes.io/name: migrations
  annotations:
    # The three keys migration-job.yaml needs, in a Secret that lives and
    # dies with the hook Job itself. Ordinary resources (secret.yaml among
    # them) are only created *after* every pre-install/pre-upgrade hook has
    # finished, so the Job cannot read the main Secret — but hooking the
    # main Secret instead would take it out of the release manifest, and
    # `helm uninstall` would then orphan every credential in it. A lower
    # (earlier) weight than the Job puts this first within the hook phase.
    #
    # hook-succeeded, not hook-failed: a Job that failed keeps its Secret so
    # the pod can be re-run/inspected; before-hook-creation clears a stale
    # one from a previous failed release on the next attempt.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  APP_SECRET_KEY: {{ .Values.secrets.appSecretKey | quote }}
  APP_DATABASE_ROLE_PASSWORD: {{ .Values.secrets.databaseRolePassword | quote }}
  APP_MIGRATION_DATABASE_PASSWORD: {{ .Values.secrets.migrationDatabasePassword | quote }}
{{- end }}
