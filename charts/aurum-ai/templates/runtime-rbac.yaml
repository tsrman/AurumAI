{{- include "aurum-ai.validateRuntimeNamespaces" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aurum-ai.backendServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aurum-ai.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aurum-ai.skillExecutorServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aurum-ai.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-runner-manager
  namespace: {{ include "aurum-ai.runnerNamespace" . }}
  labels:
    {{- include "aurum-ai.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - create
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-runner-manager
  namespace: {{ include "aurum-ai.runnerNamespace" . }}
  labels:
    {{- include "aurum-ai.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-runner-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "aurum-ai.backendServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-sandbox-manager
  namespace: {{ include "aurum-ai.sandboxNamespace" . }}
  labels:
    {{- include "aurum-ai.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - create
      - delete
      - patch
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-sandbox-manager
  namespace: {{ include "aurum-ai.sandboxNamespace" . }}
  labels:
    {{- include "aurum-ai.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-sandbox-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "aurum-ai.skillExecutorServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
