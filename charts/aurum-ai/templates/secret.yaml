{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aurum-ai.secretName" . }}
  labels:
    {{- include "aurum-ai.labels" . | nindent 4 }}
  # Deliberately NOT a Helm hook. A hook resource is not part of the release
  # manifest, so `helm uninstall` would leave these credentials orphaned in
  # the namespace and `helm rollback` could not restore them. As an ordinary
  # resource it is tracked by the release, and Helm's kind sorter already
  # installs Secrets before Deployments. The migration Job — which runs in
  # the pre-install hook phase, before any ordinary resource exists — gets
  # its own hook-scoped copy instead: migration-secret.yaml.
type: Opaque
stringData:
  APP_SECRET_KEY: {{ .Values.secrets.appSecretKey | quote }}
  APP_DATABASE_ROLE_PASSWORD: {{ .Values.secrets.databaseRolePassword | quote }}
  APP_MIGRATION_DATABASE_PASSWORD: {{ .Values.secrets.migrationDatabasePassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  APP_S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
  APP_GATEWAY_API_KEY: {{ .Values.secrets.gatewayApiKey | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.secrets.langfuseSecretKey | quote }}
{{- end }}
