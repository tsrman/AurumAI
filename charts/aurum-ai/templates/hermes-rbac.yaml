{{- if .Values.hermes.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-hermes-manager
  namespace: {{ .Values.hermes.namespace }}
  labels:
    {{- include "aurum-ai.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - create
      - delete
      - patch
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
      - get
  # The guard's ClusterIP, for the sandbox's hostAliases entry.
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-hermes-manager
  namespace: {{ .Values.hermes.namespace }}
  labels:
    {{- include "aurum-ai.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-hermes-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "aurum-ai.skillExecutorServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
