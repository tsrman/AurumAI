{{- include "aurum-ai.validateRuntimeNamespaces" . -}}
{{- if and .Values.secrets.create .Values.runtimeNamespaces.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aurum-ai.runnerSecretName" . }}
  namespace: {{ include "aurum-ai.runnerNamespace" . }}
  labels:
    {{- include "aurum-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  REDIS_URL: {{ printf "redis://:%s@%s:%v/0" .Values.secrets.redisPassword .Values.external.redis.host .Values.external.redis.port | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.secrets.langfuseSecretKey | quote }}
{{- end }}
