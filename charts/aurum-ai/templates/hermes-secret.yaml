{{- if and .Values.hermes.enabled (not .Values.hermes.egress.existingSecret) }}
{{- $secretName := include "aurum-ai.hermesSecretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aurum-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  HERMES_EGRESS_SERVICE_SECRET: {{ .Values.hermes.egress.serviceSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.hermes.namespace }}
  labels:
    {{- include "aurum-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  HERMES_EGRESS_SERVICE_SECRET: {{ .Values.hermes.egress.serviceSecret | quote }}
{{- end }}
