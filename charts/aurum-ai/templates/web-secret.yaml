{{- if and .Values.web.enabled (not .Values.web.existingSecret) }}
{{- $secretName := printf "%s-web-secrets" .Release.Name | trunc 63 | trimSuffix "-" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aurum-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  WEB_TOOLS_SERVICE_SECRET: {{ .Values.web.serviceSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.web.namespace }}
  labels:
    {{- include "aurum-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  WEB_TOOLS_SERVICE_SECRET: {{ .Values.web.serviceSecret | quote }}
  SEARXNG_SECRET: {{ .Values.web.searxngSecret | quote }}
{{- end }}
