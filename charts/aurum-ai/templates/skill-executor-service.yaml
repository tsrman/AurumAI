apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-skill-executor
  labels:
    {{- include "aurum-ai.labels" . | nindent 4 }}
    {{- include "aurum-ai.selectorLabels" (dict "component" "skill-executor" "root" $) | nindent 4 }}
spec:
  selector:
    {{- include "aurum-ai.selectorLabels" (dict "component" "skill-executor" "root" $) | nindent 4 }}
  ports:
    - name: http
      port: 8090
      targetPort: http
