{{- include "aurum-ai.validateRuntimeNamespaces" . -}}
{{- if .Values.runtimeNamespaces.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "aurum-ai.runnerNamespace" . }}
  labels:
    {{- include "aurum-ai.labels" . | nindent 4 }}
    aurum-ai.runtime: runners
    {{- with .Values.runtimeNamespaces.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "aurum-ai.sandboxNamespace" . }}
  labels:
    {{- include "aurum-ai.labels" . | nindent 4 }}
    aurum-ai.runtime: sandboxes
    {{- with .Values.runtimeNamespaces.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
