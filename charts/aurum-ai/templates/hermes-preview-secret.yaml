{{- if and .Values.hermes.preview.enabled (not .Values.hermes.preview.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aurum-ai.hermesPreviewSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aurum-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  HERMES_PREVIEW_SERVICE_SECRET: {{ .Values.hermes.preview.serviceSecret | quote }}
  HERMES_PREVIEW_EXECUTOR_SECRET: {{ .Values.hermes.preview.executorSecret | quote }}
{{- end }}
