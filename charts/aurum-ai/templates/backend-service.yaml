apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "aurum-ai.labels" . | nindent 4 }}
    {{- include "aurum-ai.selectorLabels" (dict "component" "backend" "root" $) | nindent 4 }}
spec:
  selector:
    {{- include "aurum-ai.selectorLabels" (dict "component" "backend" "root" $) | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
