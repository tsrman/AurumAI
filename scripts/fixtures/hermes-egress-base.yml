# Standalone, disposable base for ./smoke-test-hermes-egress.sh. It is combined
# with the real docker-compose.hermes.yml overlay; never with the main Compose
# file. Use --env-file /dev/null, the explicit -p hermes-egress-test and
# --project-directory at the repository root, which relative paths below use.
x-backend-env: &backend-env
  APP_DEBUG: "false"
  APP_SECRET_KEY: hermes-egress-acceptance-only-signing-key
  APP_DATABASE_URL: postgresql+asyncpg://aurum_ai_app:hermes-egress-app-password@postgres:5432/aurum_ai
  APP_REDIS_URL: redis://redis:6379/0
  APP_KEYCLOAK_URL: http://keycloak:8080
  APP_KEYCLOAK_ISSUER: http://keycloak:8080/realms/aurum-ai
  APP_KEYCLOAK_REALM: aurum-ai
  APP_KEYCLOAK_CLIENT_ID: business-ui
  APP_FRONTEND_URL: http://127.0.0.1:13000
  APP_TEMPORAL_HOST: temporal:7233
  APP_TEMPORAL_NAMESPACE: default
  APP_INIT_DB_ON_STARTUP: "false"
  APP_RUNNER_POOL_SIZE: "0"
  APP_LLM_GATEWAY_URL: http://gateway:8000
  APP_GATEWAY_API_KEY: hermes-egress-fixture-key
  APP_IDENTITY_SYNC_ENABLED: "false"

services:
  postgres:
    image: aurum-ai-postgres:hermes-egress-test
    environment:
      POSTGRES_DB: aurum_ai
      POSTGRES_PASSWORD: postgres
    tmpfs: [/var/lib/postgresql/data]
    ports: ["127.0.0.1:55436:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  temporal:
    image: temporalio/admin-tools:1.32.0
    entrypoint: ["temporal", "server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/tmp/hermes-egress-temporal.db"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 3s
      timeout: 3s
      retries: 30
  # Publishes an empty key set: the backend loads JWKS at startup, and no route
  # this acceptance uses accepts a Keycloak token.
  keycloak:
    image: python:3.12-slim
    entrypoint:
      - python
      - -c
      - |
        import http.server, json
        class H(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
                body = json.dumps({"keys": []}).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
        http.server.ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
  gateway:
    image: aurum-ai-test-gateway:latest
    entrypoint: ["python", "-m", "uvicorn", "test-gateway:app", "--app-dir", "/", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./scripts/k8s-test-gateway.py:/test-gateway.py:ro
    environment:
      TEST_GATEWAY_MODEL_ID: hermes-egress-test
  migrate:
    build: ./business-backend
    image: aurum-ai-backend:hermes-egress-test
    entrypoint: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
      APP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/aurum_ai
      APP_DATABASE_ROLE_PASSWORD: hermes-egress-app-password
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    image: aurum-ai-backend:hermes-egress-test
    entrypoint: ["python", "-m", "uvicorn", "src.main_business:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *backend-env
    ports: ["127.0.0.1:58000:8000"]
    # Named explicitly: the overlay adds hermes-backend, which would otherwise
    # replace the implicit default network.
    networks: [default]
    depends_on:
      migrate: {condition: service_completed_successfully}
      temporal: {condition: service_healthy}
      keycloak: {condition: service_started}
    restart: on-failure:10
  # The overlay also configures backend-admin; the acceptance does not run it.
  backend-admin:
    image: aurum-ai-backend:hermes-egress-test
    profiles: ["unused"]
  # Started only by ./smoke-test-hermes-sandbox.sh; the overlay adds its Hermes
  # settings. It drives the host's Docker daemon, like the main stack's.
  skill-executor:
    build: ./skill-executor
    image: aurum-ai-skill-executor:hermes-egress-test
    profiles: ["hermes-sandbox"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_HOST: "unix:///var/run/docker.sock"
      OTEL_EXPORTER_OTLP_ENDPOINT: "console"
      SKILL_EXECUTOR_REAP_INTERVAL_SECONDS: "${SKILL_EXECUTOR_REAP_INTERVAL_SECONDS:-15}"
      SKILL_EXECUTOR_HERMES_IDLE_TTL_SECONDS: "${SKILL_EXECUTOR_HERMES_IDLE_TTL_SECONDS:-1800}"
      SKILL_EXECUTOR_HERMES_ORPHAN_GRACE_SECONDS: "${SKILL_EXECUTOR_HERMES_ORPHAN_GRACE_SECONDS:-600}"
      SKILL_EXECUTOR_HERMES_SNAPSHOT_RETRY_SECONDS: "${SKILL_EXECUTOR_HERMES_SNAPSHOT_RETRY_SECONDS:-300}"
      SKILL_EXECUTOR_HERMES_MAX_RUNNING_PER_ORG: "${SKILL_EXECUTOR_HERMES_MAX_RUNNING_PER_ORG:-4}"
      SKILL_EXECUTOR_HERMES_WORKSPACE_MODE: "${SKILL_EXECUTOR_HERMES_WORKSPACE_MODE:-volume}"
      SKILL_EXECUTOR_HERMES_WORKSPACE_MAX_BYTES: "${SKILL_EXECUTOR_HERMES_WORKSPACE_MAX_BYTES:-1073741824}"
      SKILL_EXECUTOR_HERMES_DISK_CHECK_INTERVAL_SECONDS: "${SKILL_EXECUTOR_HERMES_DISK_CHECK_INTERVAL_SECONDS:-60}"
      SKILL_EXECUTOR_S3_ENDPOINT: http://minio:9000
      SKILL_EXECUTOR_S3_ACCESS_KEY: minio
      SKILL_EXECUTOR_S3_SECRET_KEY: hermes-snapshot-acceptance-secret
      SKILL_EXECUTOR_S3_BUCKET: aurum-ai-business
    ports: ["127.0.0.1:58090:8090"]
  # Holds the workspace snapshots; tmpfs, like everything else here.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["hermes-sandbox"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: hermes-snapshot-acceptance-secret
    entrypoint:
      - /bin/sh
      - -c
      - |
        minio server /data &
        until mc alias set local http://localhost:9000 minio hermes-snapshot-acceptance-secret >/dev/null 2>&1 && mc ready local >/dev/null 2>&1; do sleep 1; done
        mc mb --ignore-existing local/aurum-ai-business
        touch /tmp/bucket-ready
        wait
    tmpfs: [/data]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/bucket-ready"]
      interval: 2s
      timeout: 2s
      retries: 30
