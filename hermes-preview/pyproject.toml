[project]
license = "AGPL-3.0-only"
name = "hermes-preview"
version = "0.1.0"
description = "Previews of the apps Hermes Agent runs in its sandbox, at origins of their own"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "aiohttp==3.14.5",
    "h11>=0.16.0,<0.17.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0,<2.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "ruff>=0.8.0,<0.9.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
