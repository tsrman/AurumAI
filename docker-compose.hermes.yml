# Hermes Agent sandbox egress (docs/HERMES_AGENT.md). Opt-in overlay:
#   docker compose -f docker-compose.yml -f docker-compose.hermes.yml --profile hermes up -d
#
# skill-executor gives every Hermes sandbox its own internal network, carved
# from HERMES_SANDBOX_POOL in isolated gateway mode (Docker 28+), and connects
# only the hermes-egress guard to it. Out of a sandbox go the platform path (to
# the backend over `hermes-backend`) and, up to HERMES_EGRESS_MAX_MODE, CONNECT
# tunnels to the internet over `hermes-public`. The backend never joins a
# sandbox network, and sandboxes never share one.
services:
  backend:
    environment:
      APP_HERMES_ENABLED: "${HERMES_ENABLED:-false}"
      # One variable for the backend's clamp and the guard's public ports.
      APP_HERMES_EGRESS_MAX_MODE: "${HERMES_EGRESS_MAX_MODE:-packages}"
      APP_HERMES_EGRESS_SERVICE_SECRET: "${HERMES_EGRESS_SERVICE_SECRET:?HERMES_EGRESS_SERVICE_SECRET must be set}"
      # Previews of apps Hermes runs, at origins of their own (profile hermes-preview).
      APP_HERMES_PREVIEW_ENABLED: "${HERMES_PREVIEW_ENABLED:-false}"
      APP_HERMES_PREVIEW_ORIGIN: "${HERMES_PREVIEW_ORIGIN:-}"
      APP_HERMES_PREVIEW_SERVICE_SECRET: "${HERMES_PREVIEW_SERVICE_SECRET:-}"
    networks:
      hermes-backend:
        aliases: ["hermes-backend"]

  backend-admin:
    environment:
      APP_HERMES_ENABLED: "${HERMES_ENABLED:-false}"
      APP_HERMES_EGRESS_MAX_MODE: "${HERMES_EGRESS_MAX_MODE:-packages}"

  skill-executor:
    environment:
      SKILL_EXECUTOR_HERMES_ENABLED: "${HERMES_ENABLED:-false}"
      SKILL_EXECUTOR_HERMES_SANDBOX_IMAGE: "aurum-ai-hermes-sandbox:latest"
      SKILL_EXECUTOR_HERMES_GUARD_CONTAINER: "aurum-ai-hermes-egress-guard"
      SKILL_EXECUTOR_HERMES_PREVIEW_SECRET: "${HERMES_PREVIEW_EXECUTOR_SECRET:-}"
      SKILL_EXECUTOR_HERMES_SUBNET_POOL: "${HERMES_SANDBOX_POOL:-172.31.0.0/16}"

  # Build-only, like skill-sandbox: skill-executor starts these containers.
  hermes-sandbox:
    build:
      context: ./hermes-sandbox
    image: aurum-ai-hermes-sandbox:latest
    profiles: ["build"]

  hermes-egress-guard:
    build:
      context: ./infra/web-egress
    image: aurum-ai-web-egress:latest
    # skill-executor connects this exact container to each sandbox network.
    container_name: aurum-ai-hermes-egress-guard
    profiles: ["hermes"]
    cap_drop: ["ALL"]
    cap_add: ["NET_ADMIN"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run:rw,noexec,nosuid,size=1m
    environment:
      WEB_EGRESS_MODE: hermes
      WEB_EGRESS_READY_PORT: "8192"
      HERMES_EGRESS_PLATFORM_PORT: "8080"
      HERMES_EGRESS_PROXY_PORT: "3128"
      HERMES_EGRESS_SANDBOX_CIDRS: "${HERMES_SANDBOX_POOL:-172.31.0.0/16}"
      HERMES_EGRESS_BACKEND_HOST: hermes-backend
      HERMES_EGRESS_BACKEND_PORT: "8000"
      HERMES_EGRESS_MAX_MODE: "${HERMES_EGRESS_MAX_MODE:-packages}"
      HERMES_EGRESS_INTERNAL_PACKAGE_HOSTS: "${HERMES_EGRESS_INTERNAL_PACKAGE_HOSTS:-}"
      WEB_EGRESS_FORBIDDEN_CIDRS: "${WEB_EGRESS_FORBIDDEN_CIDRS:-}"
    networks:
      hermes-backend: {}
      hermes-public:
        gw_priority: 1
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/web-egress-readiness", "--check", "--port", "8192"]
      interval: 2s
      timeout: 2s
      start_period: 1s
      retries: 5
    depends_on:
      backend:
        condition: service_started
        # A recreated backend has a new address; re-apply the exact exception.
        restart: true
    restart: unless-stopped

  hermes-egress:
    image: aurum-ai-web-egress:latest
    profiles: ["hermes"]
    network_mode: service:hermes-egress-guard
    user: "65534:65534"
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    environment:
      HERMES_EGRESS_PLATFORM_PORT: "8080"
      HERMES_EGRESS_PROXY_PORT: "3128"
      HERMES_EGRESS_BACKEND_HOST: hermes-backend
      HERMES_EGRESS_BACKEND_PORT: "8000"
      HERMES_EGRESS_MAX_MODE: "${HERMES_EGRESS_MAX_MODE:-packages}"
      HERMES_EGRESS_SERVICE_SECRET: "${HERMES_EGRESS_SERVICE_SECRET:?HERMES_EGRESS_SERVICE_SECRET must be set}"
      HERMES_EGRESS_PACKAGE_HOSTS: "${HERMES_EGRESS_PACKAGE_HOSTS:-pypi.org,files.pythonhosted.org,registry.npmjs.org}"
      HERMES_EGRESS_INTERNAL_PACKAGE_HOSTS: "${HERMES_EGRESS_INTERNAL_PACKAGE_HOSTS:-}"
      HERMES_EGRESS_IDLE_TIMEOUT_SECONDS: "${HERMES_EGRESS_IDLE_TIMEOUT_SECONDS:-300}"
      HERMES_EGRESS_RECHECK_SECONDS: "${HERMES_EGRESS_RECHECK_SECONDS:-30}"
      HERMES_EGRESS_MAX_CONNECTIONS: "${HERMES_EGRESS_MAX_CONNECTIONS:-16}"
      HERMES_EGRESS_MAX_BYTES_PER_TURN: "${HERMES_EGRESS_MAX_BYTES_PER_TURN:-2147483648}"
      WEB_EGRESS_FORBIDDEN_CIDRS: "${WEB_EGRESS_FORBIDDEN_CIDRS:-}"
    entrypoint:
      - python3
      - /usr/local/bin/web-egress-readiness
      - --wait
      - --port
      - "8192"
      - --
      - python3
      - /usr/local/bin/hermes-egress-proxy
    # The image's own check is the guard's readiness port. The guard admits
    # the proxy ports only from sandbox networks, so check the listener itself.
    healthcheck:
      test: ["CMD-SHELL", "ss -Hltn 'sport = :3128' | grep -q . && ss -Hltn 'sport = :8080' | grep -q ."]
      interval: 2s
      timeout: 2s
      start_period: 2s
      retries: 10
    depends_on:
      hermes-egress-guard:
        condition: service_healthy
        restart: true
    restart: unless-stopped

  # Previews (docs/HERMES_AGENT.md): the one service browsers reach at a
  # preview's origin. It asks the backend over `hermes-backend` and streams into
  # sandboxes through skill-executor, whose preview route takes its secret.
  # Without the origin and both secrets it refuses to start; the backend and
  # skill-executor refuse previews without them.
  hermes-preview:
    build:
      context: ./hermes-preview
    image: aurum-ai-hermes-preview:latest
    profiles: ["hermes-preview"]
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    environment:
      HERMES_PREVIEW_ORIGIN: "${HERMES_PREVIEW_ORIGIN:-}"
      HERMES_PREVIEW_BACKEND_URL: "http://hermes-backend:8000"
      HERMES_PREVIEW_SERVICE_SECRET: "${HERMES_PREVIEW_SERVICE_SECRET:-}"
      HERMES_PREVIEW_EXECUTOR_URL: "ws://skill-executor:8090"
      HERMES_PREVIEW_EXECUTOR_SECRET: "${HERMES_PREVIEW_EXECUTOR_SECRET:-}"
      HERMES_PREVIEW_MAX_CONNECTIONS: "${HERMES_PREVIEW_MAX_CONNECTIONS:-32}"
      HERMES_PREVIEW_IDLE_SECONDS: "${HERMES_PREVIEW_IDLE_SECONDS:-300}"
      HERMES_PREVIEW_RECHECK_SECONDS: "${HERMES_PREVIEW_RECHECK_SECONDS:-30}"
    ports:
      - "${HERMES_PREVIEW_PORT:-8095}:8095"
    networks:
      hermes-backend: {}
      skills-net: {}
      hermes-public: {}
    restart: unless-stopped

networks:
  hermes-backend:
    internal: true
  hermes-public:
    driver: bridge
