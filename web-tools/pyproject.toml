[project]
license = "AGPL-3.0-only"
name = "web-tools"
version = "0.1.0"
description = "Isolated bounded web search and reader adapter"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "aiohttp==3.14.5",
    "fastapi>=0.162.0,<0.163.0",
    "pydantic>=2.14.1,<3.0.0",
    "pydantic-settings>=2.16.1,<3.0.0",
    "pypdf==6.21.3",
    "uvicorn[standard]>=0.32.0,<0.33.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<0.29.0",
    "mypy>=1.13.0,<2.0.0",
    "pytest>=9.2.0,<10.0.0",
    "pytest-asyncio>=1.4.1,<2.0.0",
    "ruff>=0.8.0,<0.9.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
