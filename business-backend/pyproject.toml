[project]
license = "AGPL-3.0-only"
name = "business-backend"
version = "0.1.0"
description = "AurumAI business and administration API"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "fastapi>=0.141.0,<0.144.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<0.33.0",
    "alembic>=1.14.0,<2.0.0",
    "redis>=5.2.0,<9.0.0",
    "httpx>=0.28.0,<0.29.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "PyJWT[crypto]>=2.15.1,<3.0.0",
    "python-multipart>=0.0.32,<0.0.33",
    "structlog>=24.4.0,<25.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "gunicorn>=26.0.0,<27.0.0",
    "temporalio>=1.8.0,<2.0.0",
    "aiodocker>=0.23.0,<0.28.0",
    "langfuse>=2.57.0,<3.0.0",
    "pgvector>=0.3.6,<0.6.0",
    "opensearch-py>=2.8.0,<3.0.0",
    "mcp>=1.6.0,<2.0.0",
    "sse-starlette<3.0",
    "python-frontmatter>=1.1.0,<2.0.0",
    "aioboto3>=13.4.0,<14.0.0",
    "kubernetes-asyncio>=36.1.0,<37.0.0",
    "opentelemetry-api>=1.29.0,<2.0.0",
    "opentelemetry-sdk>=1.29.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.29.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "prometheus-client>=0.21.0,<0.27.0",
    "pyarrow>=23.0.1,<24",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "httpx>=0.28.0,<0.29.0",
    "testcontainers>=4.9.0,<5.0.0",
    "mypy>=1.13.0,<2.0.0",
    "ruff>=0.8.0,<0.9.0",
]

# Services are not installed as libraries: Docker copies their source,
# while uv creates the environment from the frozen lockfile.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

# No upstream stubs or py.typed markers exist for these — nothing we can
# install to fix it (PyJWT, unlike these three, ships its own py.typed marker).

[[tool.mypy.overrides]]
module = ["aioboto3.*", "langfuse.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# With tool.uv package=false, put the project root on sys.path explicitly;
# the previous package installation used to provide this import path
# through packages=[{include="src"}].
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests that require external services",
]
