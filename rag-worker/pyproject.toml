[project]
license = "AGPL-3.0-only"
name = "rag-worker"
version = "0.1.0"
description = ""
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "temporalio>=1.6.0,<2.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "httpx>=0.28.0,<0.29.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "asyncpg>=0.29.0,<0.33.0",
    "pymilvus==2.6.17",
    "docling>=2.132.0,<3.0.0",
    # Read uploaded document source files from MinIO/S3.
    "aioboto3>=13.4.0,<16.0.0",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "langchain",
    "langchain-core",
    "langchain-openai",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0,<2.0.0",
    "ruff>=0.8.0,<0.9.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
]

# Services are not installed as libraries: Docker copies their source,
# while uv creates the environment from the frozen lockfile.
[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
# Explicit index: only packages named in tool.uv.sources use this registry.
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["pymilvus.*", "docling.*", "langchain.*", "langchain_core.*", "langchain_openai.*", "aioboto3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# With tool.uv package=false, put the project root on sys.path explicitly;
# the previous package installation used to provide this import path
# implicitly.
pythonpath = ["."]
